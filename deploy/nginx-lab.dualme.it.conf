# Config nginx per lab.dualme.it -> Shotcheck (uvicorn su 127.0.0.1:8000)
#
# Installazione sul server:
#   sudo cp deploy/nginx-lab.dualme.it.conf /etc/nginx/sites-available/lab.dualme.it
#   sudo ln -s /etc/nginx/sites-available/lab.dualme.it /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Poi il certificato HTTPS (vedi DEPLOY.md):
#   sudo certbot --nginx -d lab.dualme.it

server {
    listen 80;
    listen [::]:80;
    server_name lab.dualme.it;

    client_max_body_size 100M;  # foto/TIFF possono essere pesanti

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # upload grandi: alza i timeout oltre il default di 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
